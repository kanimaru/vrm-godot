# Packages the VRM addon together with the addons it depends on, resolved by dotquay from
# dotquay.lock, so a release zip can be unzipped straight into a Godot project.
#
# - Every push to main and every pull request builds the zip and keeps it as a workflow artifact.
# - A pushed tag named v* (e.g. v0.1.0) also publishes it as a GitHub release.
#
# GitLab's wild-alliance/vrm-addon publishes a cleaned copy of its history here (publish:github in
# .gitlab-ci.yml), tags included, so a tag pushed on GitLab triggers this workflow too.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # dotquay is built from source at this tag; it has no prebuilt release on GitHub.
  DOTQUAY_REF: v0.21.1
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  package:
    # write only for `gh release create` on tags.
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build dotquay
        run: |
          git clone --depth 1 --branch "$DOTQUAY_REF" https://github.com/kanimaru/dotquay.git "$RUNNER_TEMP/dotquay"
          dotnet publish "$RUNNER_TEMP/dotquay/src/Dotquay.Cli" -c Release -p:PublishAot=false \
            -o "$RUNNER_TEMP/dotquay-bin"
          echo "$RUNNER_TEMP/dotquay-bin" >> "$GITHUB_PATH"

      - name: Resolve addons
        run: dotquay install

      - name: Pick a version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: |
          zip_name="vrm-addons-${{ steps.version.outputs.version }}.zip"
          test -f addons/vrm/plugin.cfg
          test -f addons/Godot-MToon-Shader/plugin.cfg
          zip -r -q "$zip_name" addons/vrm addons/Godot-MToon-Shader LICENSE NOTICE.md \
            -x '*.git*'
          unzip -l "$zip_name" | tail -1
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: vrm-addons
          path: ${{ env.ZIP_NAME }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes
